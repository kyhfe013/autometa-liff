<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>セラピーの報告を受け取る</title>
<!-- ★LINE などに貼ったときの見出し★
     指定しないと、読み込み中の文字（「登録しています」）が説明として拾われる。
     2026-10-03、トークに貼ると「お知らせの登録／登録しています」とだけ出た。 -->
<meta name="description" content="友だち追加すると、セラピーが完了したときに LINE でお知らせが届きます。お名前やご連絡先の入力はありません。">
<meta property="og:type" content="website">
<meta property="og:title" content="セラピーの報告を受け取る">
<meta property="og:description" content="タップして友だち追加すると、セラピーが完了したときに LINE でお知らせが届きます。お名前やご連絡先の入力はありません。">
<meta property="og:url" content="https://therapyreport.jp/">
<meta property="og:site_name" content="セラピーの報告">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f23; --sub:#5b646e;
    --line:#e3e7eb; --ok:#06c755; --ng:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181c; --card:#1e2227; --ink:#eef1f4; --sub:#a7b0ba; --line:#2d333a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px 16px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:28px 22px; width:100%; max-width:420px; text-align:center;
  }
  .mark{font-size:44px; line-height:1; margin-bottom:14px}
  h1{font-size:19px; margin:0 0 10px; font-weight:700}
  p{font-size:15px; line-height:1.75; color:var(--sub); margin:0 0 6px}
  .ok h1{color:var(--ok)}
  .ng h1{color:var(--ng)}
  .warn h1{color:#c77700}
  .from{font-size:13px;color:var(--sub);margin:0 0 12px;padding-bottom:10px;
        border-bottom:1px solid var(--line)}
  .add{display:block;margin:18px auto 4px;padding:13px 10px;max-width:260px;
       background:var(--ok);color:#fff;border-radius:10px;text-decoration:none;
       font-size:16px;font-weight:700;text-align:center}
  .note{
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
    font-size:13px; color:var(--sub); line-height:1.7;
  }
  .spin{
    width:30px; height:30px; margin:4px auto 16px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--sub);
    animation:r .8s linear infinite;
  }
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="box">
  <div class="spin"></div>
  <h1>セラピーの報告を受け取る</h1>
  <p>登録しています。そのままお待ちください。</p>
</div>

<script>
/* AutoMeta 対象者の登録
 *
 *   セラピストから渡された QR を読むと、このページが LINE の中で開く。
 *   ここで行うのは「合言葉」と「LINE の ID」をセラピストへ渡すことだけ。
 *   ★氏名・生年月日・電話番号・メールアドレスは一切扱わない★
 *
 *   ?p=<合言葉>  ?l=<LIFF ID>
 *     どちらも QR（LIFF URL）の側に入っている。
 *     ★エンドポイント URL には何も付けない★
 *     付けた問い合わせ文字列は LINE 側で落ちることがあり、
 *     実機で「URL が正しくありません」になった（2026-10-02）。
 */
var GAS = "https://script.google.com/macros/s/AKfycbxZy7hP0-oSJED1hWNhRV4mW8aW4byQm06rG85oHjFaoRmJkMLoc8QnylGddz_5m5ED/exec";

// ★LINE は問い合わせ文字列を liff.state に畳んで渡すことがある★
//   そのとき location.search は ?liff.state=%3Fp%3D… だけになり、
//   p も l も直接は見えない。SDK が元に戻すのは liff.init() のあとで、
//   こちらは init の前に読む必要があるので、自分でほどく（2026-10-02）。
//   念のため、場所（#）側も見る。
function allParams(){
  var out = {};
  function eat(qs){
    if (!qs) return;
    if (qs.charAt(0) === "?" || qs.charAt(0) === "#") qs = qs.slice(1);
    qs.split("&").forEach(function(pair){
      if (!pair) return;
      var i = pair.indexOf("=");
      var k = i < 0 ? pair : pair.slice(0, i);
      var v = i < 0 ? ""   : pair.slice(i + 1);
      try { k = decodeURIComponent(k); v = decodeURIComponent(v); } catch (e) {}
      if (!(k in out)) out[k] = v;
    });
  }
  eat(location.search);
  eat(location.hash);
  // liff.state の中身は、元の「?p=…&l=…」がそのまま入っている
  var st = out["liff.state"];
  if (st) eat(st);
  return out;
}
var PARAMS = allParams();
function q(name){ return PARAMS[name] || ""; }

function esc(t){
  return String(t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function show(cls, mark, title, body, note){
  var box = document.getElementById("box");
  var shop = q("s");
  box.className = "card " + cls;
  box.innerHTML =
      (shop ? '<div class="from">' + esc(shop) + '</div>' : '')
    + '<div class="mark">' + mark + '</div>'
    + '<h1>' + title + '</h1>'
    + '<p>' + body + '</p>'
    + (note ? '<div class="note">' + note + '</div>' : '');
}

function fail(body){
  show("ng", "！", "登録できませんでした", body,
       "この画面を閉じて、セラピストにお伝えください。");
}

function doneOk(){
  show("ok", "✓", "登録を受け付けました",
       "このトークに確認のメッセージが届いたら、準備は完了です。"
     + "<br>数分かかることがあります。",
       "お名前・ご連絡先の入力は必要ありません。<br>"
     + "お知らせが不要になったときは、いつでもお申し付けください。<br>"
     + "この画面は閉じて構いません。");
}

// 友だち追加がまだのとき。ここで止めず、押せる形で出す。
function needFriend(){
  var oa = q("a");
  var btn = oa
    ? '<a class="add" href="https://line.me/R/ti/p/' + encodeURIComponent(oa) + '">友だち追加する</a>'
    : '';
  show("warn", "！", "あと 1 歩です",
       "友だち追加がされていないため、このままではお知らせが届きません。"
     + btn,
       oa ? "上のボタンを押して「追加」を選んでください。<br>"
          + "追加すると、確認のメッセージが届きます。"
          : "この画面を閉じて、セラピストにお伝えください。");
}

function run(){
  var liffId = q("l");
  var code   = q("p").toUpperCase();

  // l（LIFF ID）と p（合言葉）は、どちらも QR の側に入っている。
  // 片方でも欠けていれば、発行し直してもらうのがいちばん早い。
  if (!liffId){
    fail("この QR は古い形式です。セラピストに発行し直してもらってください。"); return;
  }
  if (!/^[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(code)){
    fail("合言葉を読み取れませんでした。セラピストに発行し直してもらってください。"); return;
  }

  liff.init({ liffId: liffId })
    .catch(function(){
      // ★ここで失敗するのはセラピスト側の設定★ 患者の電波のせいにしない
      fail("この QR は使えません。セラピストにお伝えください。");
      throw "init";
    })
    .then(function(){
      if (!liff.isLoggedIn()){ liff.login(); return null; }   // 戻ってきたら、もう一度ここを通る
      // ★身元証明は openid の許可が要る★
      //   LIFF アプリのスコープに openid が無いと、ここが空で返る。
      //   2026-10-02、実機で「通信できませんでした」と出た原因がこれ。
      var token = liff.getIDToken();
      if (!token){
        fail("セラピスト側の設定が足りません（LIFF の許可に openid が必要）。<br>"
           + "この画面をセラピストにお見せください。");
        throw "noid";
      }
      return fetch(GAS, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },  // 事前確認を起こさない形で送る
        body: JSON.stringify({ act: "put", p: code, idToken: token })
      }).catch(function(){
        fail("登録の窓口につながりませんでした。<br>"
           + "電波の良い場所で、もう一度お試しください。");
        throw "net";
      });
    })
    .then(function(res){
      if (res === null) return null;                           // ログインへ飛んだところ
      return res.json().catch(function(){
        fail("登録の窓口から、読み取れない返事がありました。<br>"
           + "この画面をセラピストにお見せください。");
        throw "parse";
      });
    })
    .then(function(r){
      if (r === null) return;
      if (r && r.ok){
        // ★友だち追加がまだなら、その場で気づいてもらう★
        //   同意画面のチェックは最初からオフで、見落とす人が多い。
        //   セラピストが気づくまで誰も分からない状態にしない（2026-10-03）。
        return liff.getFriendship().then(function(f){
          if (f && f.friendFlag){ doneOk(); return; }
          needFriend();
        }, function(){ doneOk(); });               // 判定できないときは通す
      } else if (r && r.why === "bad_code"){
        fail("合言葉が正しくありません。");
      } else if (r && r.why === "verify_failed"){
        fail("LINE の確認が通りませんでした。もう一度 QR を読んでください。");
      } else {
        fail("もう一度 QR を読んでください。");
      }
    })
    .catch(function(e){
      // すでに出しているものは、上書きしない
      if (e === "init" || e === "noid" || e === "net" || e === "parse") return;
      fail("登録の途中で止まりました。<br>この画面をセラピストにお見せください。");
    });
}

if (window.liff) { run(); }
else { window.addEventListener("load", run); }
</script>
</body>
</html>
